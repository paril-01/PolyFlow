name: PolyFlow Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Automated Validation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml hypothesis dash fastapi uvicorn httpx pydantic

      - name: Run Core PolyFlow Tests
        run: |
          pytest tests/test_polyflow.py -v

      - name: Run Feature Closure & Multi-Layer Extraction Tests
        run: |
          pytest tests/test_feature_closure.py -v

      - name: Run UI Claims & Evidence Consistency Tests
        run: |
          pytest tests/test_ui_claims.py tests/test_final_claim_consistency.py -v

      - name: Run Backend Proof Server Tests
        run: |
          pytest tests/test_backend_proof_server.py -v

      - name: Run Benchmark Integrity & Anti-Fabrication Suite
        run: |
          pytest tests/benchmark_integrity/ -v

  react-build:
    name: React Visualizer Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Visualizer
        working-directory: rcir/visualizer-react
        run: |
          npm ci
          npm run build
