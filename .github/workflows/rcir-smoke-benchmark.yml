name: RCIR Benchmark Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Verify Environment & Sentinels
      run: |
        python experiments/rcir_v8_5/scripts/environment.py

    - name: Validate Ground Truth Provenance
      run: |
        python experiments/rcir_v8_5/scripts/validate_ground_truth_provenance.py

    - name: Run Fast Capability Probing
      run: |
        python experiments/rcir_v8_5/scripts/probe_provider.py

    - name: Run Generalization Readiness Evaluator
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_generalization.py
