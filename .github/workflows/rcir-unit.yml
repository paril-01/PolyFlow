name: RCIR Unit Tests & Static Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov psutil

    - name: Run Ground Truth Provenance Validation
      run: |
        python experiments/rcir_v8_5/scripts/validate_ground_truth_provenance.py

    - name: Run RCIR v8.5 Regression and Unit Tests
      run: |
        PYTHONPATH=rcir/src:experiments/rcir_v8_5/scripts pytest tests/test_rcir_v8_5.py -v
