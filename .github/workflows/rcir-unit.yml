name: RCIR Unit Tests & Static Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov psutil

    - name: Run Ground Truth Provenance Validation
      run: |
        python experiments/rcir_v8_5/scripts/validate_ground_truth_provenance.py

    - name: Run RCIR Stages 1-14 and Core Unit Tests
      run: |
        PYTHONPATH=rcir/src:experiments/rcir_v8_5/scripts:experiments/rcir_v8_5 pytest \
          tests/test_stage1_core_correctness.py \
          tests/test_stage2_submodules.py \
          tests/test_stage3_ranking.py \
          tests/test_stage4_agent_wiring.py \
          tests/test_stage5_contract_and_gates.py \
          tests/test_stage6_provenance_binding.py \
          tests/test_stage7_contract_feasibility.py \
          tests/test_stage8_report_truthfulness.py \
          tests/test_stage9_discovery_no_answer_injection.py \
          tests/test_stage10_retrieval_execution.py \
          tests/test_stage11_run_lifecycle.py \
          tests/test_stage12_agent_evidence.py \
          tests/test_stage13_generalization_truthfulness.py \
          tests/test_stage14_report_run_consistency.py \
          tests/test_agent_loop.py \
          tests/test_repo_tools.py \
          -v
