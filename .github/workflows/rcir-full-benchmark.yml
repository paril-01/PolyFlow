name: RCIR Full Benchmark Execution & Validation

on:
  workflow_dispatch:
    inputs:
      candidate_pool_limit:
        description: 'Candidate pool limit'
        required: false
        default: '2000'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest psutil

    - name: Validate Ground Truth Provenance
      run: |
        python experiments/rcir_v8_5/scripts/validate_ground_truth_provenance.py

    - name: Evaluate Canonical Graph Integrity
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_canonical_graph.py

    - name: Evaluate Canonicalization Corpus
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_canonicalization.py

    - name: Evaluate Type-Flow Receiver Precision
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_type_flow.py

    - name: Evaluate Typed Edge Hard Negatives
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_edges.py

    - name: Run Multi-Channel Semantic Retrieval
      run: |
        python experiments/rcir_v8_5/scripts/retrieval_runner.py

    - name: Compile Context and Evaluate Saturation Curve
      run: |
        python experiments/rcir_v8_5/scripts/context_runner.py

    - name: Evaluate Pipeline Determinism
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_determinism.py

    - name: Evaluate Generalization Readiness
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_generalization.py

    - name: Evaluate Machine Contract Gates
      run: |
        python experiments/rcir_v8_5/scripts/evaluate_gates.py

    - name: Generate Reports
      run: |
        python experiments/rcir_v8_5/scripts/generate_reports.py

    - name: Validate Report Consistency
      run: |
        python experiments/rcir_v8_5/scripts/validate_report_consistency.py

    - name: Scan Run Consistency
      run: |
        python experiments/rcir_v8_5/scripts/scan_run_consistency.py
