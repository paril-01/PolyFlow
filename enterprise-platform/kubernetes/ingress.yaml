apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-ingress
  namespace: ecp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.ecp.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-go
            port:
              number: 8080
