apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-go
  namespace: ecp
  labels:
    app: gateway-go
    team: platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway-go
  template:
    metadata:
      labels:
        app: gateway-go
    spec:
      containers:
      - name: gateway-go
        image: ecp/gateway-go:latest
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
