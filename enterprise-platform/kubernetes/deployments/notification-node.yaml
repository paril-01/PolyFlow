apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-node
  namespace: ecp
  labels:
    app: notification-node
    team: platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-node
  template:
    metadata:
      labels:
        app: notification-node
    spec:
      containers:
      - name: notification-node
        image: ecp/notification-node:latest
        ports:
        - containerPort: 8087
        env:
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 10
