apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-react
  namespace: ecp
  labels:
    app: frontend-react
    team: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-react
  template:
    metadata:
      labels:
        app: frontend-react
    spec:
      containers:
      - name: frontend-react
        image: ecp/frontend-react:latest
        ports:
        - containerPort: 3000
        env:
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
