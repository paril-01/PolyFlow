syntax = "proto3";
package ecp.ai_features;
option go_package = "github.com/ecp/shared-proto/ai_features";
option java_package = "com.ecp.proto.ai_features";

message SemanticSearchRerankRequest {
  string id = 1;
  string timestamp = 2;
  map<string, string> metadata = 3;
}

message SemanticSearchRerankResponse {
  string id = 1;
  string status = 2;
  double processing_time_ms = 3;
}

service SemanticSearchRerankService {
  rpc Execute (SemanticSearchRerankRequest) returns (SemanticSearchRerankResponse);
}
