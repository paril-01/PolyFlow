syntax = "proto3";
package ecp.authentication;
option go_package = "github.com/ecp/shared-proto/authentication";
option java_package = "com.ecp.proto.authentication";

message JwtTokenIssueRequest {
  string id = 1;
  string timestamp = 2;
  map<string, string> metadata = 3;
}

message JwtTokenIssueResponse {
  string id = 1;
  string status = 2;
  double processing_time_ms = 3;
}

service JwtTokenIssueService {
  rpc Execute (JwtTokenIssueRequest) returns (JwtTokenIssueResponse);
}
