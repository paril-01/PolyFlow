syntax = "proto3";
package ecp.orders;
option go_package = "github.com/ecp/shared-proto/orders";
option java_package = "com.ecp.proto.orders";

message OrderReturnRequestRequest {
  string id = 1;
  string timestamp = 2;
  map<string, string> metadata = 3;
}

message OrderReturnRequestResponse {
  string id = 1;
  string status = 2;
  double processing_time_ms = 3;
}

service OrderReturnRequestService {
  rpc Execute (OrderReturnRequestRequest) returns (OrderReturnRequestResponse);
}
