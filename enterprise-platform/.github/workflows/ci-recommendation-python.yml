name: CI - recommendation-python
on:
  push:
    paths: ['recommendation-python/**']
  pull_request:
    paths: ['recommendation-python/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      working-directory: recommendation-python
      run: pytest tests/ -v --cov=app

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t ecp/recommendation-python:${{ github.sha }} ./recommendation-python
