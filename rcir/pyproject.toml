[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcir"
version = "0.2.0.dev0"
description = "Dependency-Graph Context Runtime — structurally-derived, token-budgeted context for LLM coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = ["tiktoken>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
rcir = "rcir.service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
